name: Acquire Unity License

on:
  workflow_dispatch:

jobs:
  get-license:
    runs-on: ubuntu-latest
    steps:
      - name: Request License
        uses: game-ci/unity-request-activation-file@v2
        
      - name: Upload License Request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-Request
          path: ./*.alf
