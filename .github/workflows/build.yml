name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build with Unity - Free runner
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: public
        with:
          targetPlatform: Android
          
